name: Update README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deterministic Execution Check
        id: check
        run: |
          # Run every other day by checking days since epoch
          DAYS=$(($(date +%s) / 86400))
          
          # Skip one day: run if days since epoch is even (or odd)
          if (( DAYS % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping generation today."
          fi

      - name: Setup Python
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate SVG
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python generate.py

      - name: Generate GitHub Stats
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python stats.py

      - name: Commit and Push
        if: steps.check.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dark.svg light.svg README.md
          git commit -m "Update Game of Life simulation and GitHub Stats" || echo "No changes to commit"
          git push
